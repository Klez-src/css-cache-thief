<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Cache Thief</title>
    <style>
        body {
            background: #f5f5f5;
            transition: background 0.3s, color 0.3s;
        }
        body.dark-mode {
            background: #1a1a1a;
            color: #eee;
        }
        body.dark-mode .container {
            background: #2d2d2d;
            border-color: #444;
        }
        body.dark-mode .log-box {
            background: #1e1e1e;
        }
        body.dark-mode .log-panel {
            background: #2d2d2d;
            border-color: #444;
        }
        body.dark-mode input {
            background: #3d3d3d;
            border-color: #555;
            color: #eee;
        }
        body.dark-mode input::placeholder {
            color: #888;
        }
        body.dark-mode button[type="submit"] {
            background: #0056b3;
        }
        body.dark-mode .log-header {
            color: #eee;
        }
        body.dark-mode .clear-btn {
            background: #444;
            color: #eee;
            border-color: #555;
        }
        body.dark-mode .clear-btn:hover {
            background: #555;
        }
        body.dark-mode .dark-toggle {
            background: #444;
            color: #eee;
            border-color: #555;
        }
        body.dark-mode .dark-toggle:hover {
            background: #555;
        }

        .container {
            max-width: 500px;
            margin: 50px auto;
            font-family: system-ui;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background: white;
            transition: background 0.3s;
        }
        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .dark-toggle {
            padding: 6px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: #f0f0f0;
            cursor: pointer;
            font-size: 14px;
        }
        .dark-toggle:hover {
            background: #e0e0e0;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            transition: background 0.3s, border-color 0.3s, color 0.3s;
        }
        button[type="submit"] {
            width: 100%;
            padding: 12px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button[type="submit"]:hover {
            background: #0056b3;
        }
        .log-panel {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 4px;
            font-size: 14px;
            transition: background 0.3s;
        }
        .log-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            transition: color 0.3s;
        }
        .clear-btn {
            padding: 4px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: white;
            cursor: pointer;
            font-size: 12px;
            transition: background 0.3s, color 0.3s, border-color 0.3s;
        }
        .clear-btn:hover {
            background: #f0f0f0;
        }
        .log-box {
            height: 200px;
            overflow-y: scroll;
            background: #1e1e1e;
            color: #00ff00;
            padding: 10px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
            transition: background 0.3s;
        }
        .log-box .waiting {
            color: #888;
        }
        .log-box .char-entry { color: #00ff00; }
        .log-box .pwd-entry { color: #ff4444; }
        .log-box .csrf-entry { color: #ffaa00; }
        .log-box .event-entry { color: #00ccff; }
        .log-box .unknown-entry { color: #888; }
        .log-box .typing-entry { color: #666; }
        .log-box .demo-entry { color: #00ccff; }
        .log-box .summary {
            color: #ffaa00;
            border-top: 1px solid #333;
            margin-top: 5px;
            padding-top: 5px;
        }
    </style>
</head>
<body>

    <div class="container">

        <div class="header-row">
            <h1>Secure Login</h1>
            <button class="dark-toggle" onclick="toggleDarkMode()">Dark</button>
        </div>

        <p style="color: #666;">Enter your credentials below</p>

        <meta name="csrf-token" content="abc123xyz789" />

        <form id="loginForm" onsubmit="return false;">

            <div style="margin-bottom: 15px;">
                <label style="display: block; font-weight: bold; margin-bottom: 5px;">Username</label>
                <input
                    type="text"
                    name="username"
                    placeholder="Enter username"
                    autocomplete="off"
                />
            </div>

            <div style="margin-bottom: 15px;">
                <label style="display: block; font-weight: bold; margin-bottom: 5px;">Password</label>
                <input
                    type="password"
                    name="password"
                    placeholder="Enter password"
                    autocomplete="off"
                />
            </div>

            <div style="margin-bottom: 15px;">
                <label style="display: block; font-weight: bold; margin-bottom: 5px;">Secret Answer</label>
                <input
                    type="text"
                    name="secret"
                    placeholder="What is your pet's name?"
                    autocomplete="off"
                />
            </div>

            <button type="submit">Login</button>

        </form>

        <div class="log-panel">
            <div class="log-header">
                <strong>Exfiltration Log</strong>
                <button class="clear-btn" onclick="clearLog()">Clear</button>
            </div>
            <div id="logDisplay" class="log-box">
                <div class="waiting">Waiting for activity...</div>
            </div>
        </div>

    </div>

    <script>

        const logDisplay = document.getElementById('logDisplay');
        const exfiltratedData = {
            chars: [],
            events: [],
            passwords: [],
            csrf: []
        };

        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            const btn = document.querySelector('.dark-toggle');
            if (document.body.classList.contains('dark-mode')) {
                btn.textContent = 'Light';
            } else {
                btn.textContent = 'Dark';
            }
        }

        function clearLog() {
            exfiltratedData.chars = [];
            exfiltratedData.events = [];
            exfiltratedData.passwords = [];
            exfiltratedData.csrf = [];
            logDisplay.innerHTML = '<div class="waiting">Waiting for activity...</div>';
        }

        const originalFetch = window.fetch;

        window.fetch = function(...args) {
            const url = args[0];
            if (typeof url === 'string' && url.startsWith('/log')) {
                logExfiltration(url);
                return Promise.resolve(new Response('OK', { status: 200 }));
            }
            return originalFetch.apply(this, args);
        };

        const originalImageSrc = Object.getOwnPropertyDescriptor(Image.prototype, 'src');

        Object.defineProperty(Image.prototype, 'src', {
            get: function() {
                return this._src;
            },
            set: function(value) {
                if (typeof value === 'string' && value.startsWith('/log')) {
                    logExfiltration(value);
                    return;
                }
                this._src = value;
                originalImageSrc.set.call(this, value);
            },
            configurable: true
        });

        function logExfiltration(url) {

            const params = new URLSearchParams(url.split('?')[1] || '');
            const char = params.get('char');
            const event = params.get('event');
            const pwdChar = params.get('pwd_char');
            const csrfChar = params.get('csrf_char');
            const field = params.get('field');

            let message = '';
            let className = '';

            if (char) {
                exfiltratedData.chars.push(char);
                message = 'Keystroke: "' + char + '"';
                className = 'char-entry';
            } else if (pwdChar) {
                exfiltratedData.passwords.push(pwdChar);
                message = 'Password char: "' + pwdChar + '"';
                className = 'pwd-entry';
            } else if (csrfChar) {
                exfiltratedData.csrf.push(csrfChar);
                message = 'CSRF token char: "' + csrfChar + '"';
                className = 'csrf-entry';
            } else if (event) {
                exfiltratedData.events.push(event);
                message = 'Event: ' + event + (field ? ' (field: ' + field + ')' : '');
                className = 'event-entry';
            } else {
                message = 'Unknown request: ' + url;
                className = 'unknown-entry';
            }

            const entry = document.createElement('div');
            entry.className = className;
            entry.textContent = '[' + new Date().toLocaleTimeString() + '] ' + message;
            logDisplay.appendChild(entry);
            logDisplay.scrollTop = logDisplay.scrollHeight;

            updateSummary();

        }

        function updateSummary() {

            const summary = document.createElement('div');
            summary.className = 'summary';

            let summaryText = 'Summary: ' +
                exfiltratedData.chars.length + ' chars stolen - ' +
                exfiltratedData.passwords.length + ' password chars - ' +
                exfiltratedData.csrf.length + ' CSRF chars - ' +
                exfiltratedData.events.length + ' events';

            if (exfiltratedData.passwords.length > 0) {
                summaryText = summaryText + ' - PASSWORD DETECTED';
            }

            if (exfiltratedData.csrf.length > 0) {
                summaryText = summaryText + ' - CSRF TOKEN DETECTED';
            }

            summary.textContent = summaryText;

            const oldSummary = logDisplay.querySelector('.summary');
            if (oldSummary) oldSummary.remove();
            logDisplay.appendChild(summary);

        }

        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('input', function() {
                const entry = document.createElement('div');
                entry.className = 'typing-entry';
                entry.textContent = '[' + new Date().toLocaleTimeString() + '] User typed in ' + this.name;
                logDisplay.appendChild(entry);
                logDisplay.scrollTop = logDisplay.scrollHeight;
            });
        });

        console.log('CSS Cache Thief POC loaded');
        console.log('Every keystroke is being exfiltrated via CSS background-image');
        console.log('Check the log panel to see the stolen data');

    </script>

</body>
</html>
