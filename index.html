<body>

    <div style="max-width: 500px; margin: 50px auto; font-family: system-ui; padding: 20px; border: 1px solid #ccc; border-radius: 8px;">

        <h1>Secure Login</h1>
        <p style="color: #666;">Enter your credentials below</p>

        <meta name="csrf-token" content="abc123xyz789" />

        <form id="loginForm" onsubmit="return false;">

            <div style="margin-bottom: 15px;">
                <label style="display: block; font-weight: bold; margin-bottom: 5px;">Username</label>
                <input
                    type="text"
                    name="username"
                    placeholder="Enter username"
                    style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px;"
                    autocomplete="off"
                />
            </div>

            <div style="margin-bottom: 15px;">
                <label style="display: block; font-weight: bold; margin-bottom: 5px;">Password</label>
                <input
                    type="password"
                    name="password"
                    placeholder="Enter password"
                    style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px;"
                    autocomplete="off"
                />
            </div>

            <div style="margin-bottom: 15px;">
                <label style="display: block; font-weight: bold; margin-bottom: 5px;">Secret Answer</label>
                <input
                    type="text"
                    name="secret"
                    placeholder="What is your pet's name?"
                    style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px;"
                    autocomplete="off"
                />
            </div>

            <button
                type="submit"
                style="width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer;">
                Login
            </button>

        </form>

        <div style="margin-top: 20px; padding: 15px; background: #f8f9fa; border-radius: 4px; font-size: 14px;">
            <strong>Exfiltration Log</strong>
            <div id="logDisplay" style="height: 200px; overflow-y: scroll; background: #1e1e1e; color: #00ff00; padding: 10px; border-radius: 4px; margin-top: 8px; font-family: monospace; font-size: 12px;">
                <div style="color: #888;">Waiting for activity...</div>
            </div>
        </div>

    </div>

    <script>

        const logDisplay = document.getElementById('logDisplay');
        const exfiltratedData = {
            chars: [],
            events: [],
            passwords: [],
            csrf: []
        };

        const originalFetch = window.fetch;

        window.fetch = function(...args) {
            const url = args[0];
            if (typeof url === 'string' && url.startsWith('/log')) {
                logExfiltration(url);
                return Promise.resolve(new Response('OK', { status: 200 }));
            }
            return originalFetch.apply(this, args);
        };

        const originalImageSrc = Object.getOwnPropertyDescriptor(Image.prototype, 'src');

        Object.defineProperty(Image.prototype, 'src', {
            get: function() {
                return this._src;
            },
            set: function(value) {
                if (typeof value === 'string' && value.startsWith('/log')) {
                    logExfiltration(value);
                    return;
                }
                this._src = value;
                originalImageSrc.set.call(this, value);
            },
            configurable: true
        });

        function logExfiltration(url) {

            const params = new URLSearchParams(url.split('?')[1] || '');
            const char = params.get('char');
            const event = params.get('event');
            const pwdChar = params.get('pwd_char');
            const csrfChar = params.get('csrf_char');
            const field = params.get('field');

            let message = '';
            let type = '';

            if (char) {
                exfiltratedData.chars.push(char);
                message = 'Keystroke: "' + char + '"';
                type = 'char';
            } else if (pwdChar) {
                exfiltratedData.passwords.push(pwdChar);
                message = 'Password char: "' + pwdChar + '"';
                type = 'pwd';
            } else if (csrfChar) {
                exfiltratedData.csrf.push(csrfChar);
                message = 'CSRF token char: "' + csrfChar + '"';
                type = 'csrf';
            } else if (event) {
                exfiltratedData.events.push(event);
                message = 'Event: ' + event + (field ? ' (field: ' + field + ')' : '');
                type = 'event';
            } else {
                message = 'Unknown request: ' + url;
                type = 'unknown';
            }

            const colors = {
                char: '#00ff00',
                pwd: '#ff4444',
                csrf: '#ffaa00',
                event: '#00ccff',
                unknown: '#888'
            };

            const entry = document.createElement('div');
            entry.style.color = colors[type] || '#fff';
            entry.textContent = '[' + new Date().toLocaleTimeString() + '] ' + message;
            logDisplay.appendChild(entry);
            logDisplay.scrollTop = logDisplay.scrollHeight;

            updateSummary();

        }

        function updateSummary() {

            const summary = document.createElement('div');
            summary.style.color = '#ffaa00';
            summary.style.borderTop = '1px solid #333';
            summary.style.marginTop = '5px';
            summary.style.paddingTop = '5px';

            let summaryText = 'Summary: ' +
                exfiltratedData.chars.length + ' chars stolen - ' +
                exfiltratedData.passwords.length + ' password chars - ' +
                exfiltratedData.csrf.length + ' CSRF chars - ' +
                exfiltratedData.events.length + ' events';

            if (exfiltratedData.passwords.length > 0) {
                summaryText = summaryText + ' - PASSWORD DETECTED';
            }

            if (exfiltratedData.csrf.length > 0) {
                summaryText = summaryText + ' - CSRF TOKEN DETECTED';
            }

            summary.textContent = summaryText;

            const oldSummary = logDisplay.querySelector('.summary');
            if (oldSummary) oldSummary.remove();
            summary.className = 'summary';
            logDisplay.appendChild(summary);

        }

        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('input', function() {
                const entry = document.createElement('div');
                entry.style.color = '#666';
                entry.textContent = '[' + new Date().toLocaleTimeString() + '] User typed in ' + this.name;
                logDisplay.appendChild(entry);
                logDisplay.scrollTop = logDisplay.scrollHeight;
            });
        });

        console.log('CSS Cache Thief POC loaded');
        console.log('Every keystroke is being exfiltrated via CSS background-image');
        console.log('Check the log panel to see the stolen data');

    </script>
